name: Health Core

on:
  push:
    branches: [ main, 'feat/healthcore-**' ]
    paths:
      - 'healthcore/**'
      - 'healthcore-core/**'
      - 'app/src/main/java/com/hcwebhook/app/SyncManager.kt'
      - 'app/src/main/java/com/hcwebhook/app/HealthConnectManager.kt'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/healthcore.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'healthcore/**'
      - 'healthcore-core/**'
      - 'app/src/main/java/com/hcwebhook/app/SyncManager.kt'
      - 'app/src/main/java/com/hcwebhook/app/HealthConnectManager.kt'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/healthcore.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-healthcore-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Core tests (plain JVM, includes the parity test against :app's serializer)
        run: ./gradlew :healthcore-core:test

      - name: Core tests, standalone build (what runs without the Android SDK)
        run: ./gradlew -p healthcore-core test

      - name: App unit tests
        run: ./gradlew :healthcore:testDebugUnitTest

      - name: Lint
        run: ./gradlew :healthcore:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :healthcore:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6.0.0
        with:
          name: healthcore-debug
          path: healthcore/build/outputs/apk/debug/*.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: healthcore-reports
          path: |
            healthcore/build/reports/
            healthcore-core/build/reports/
